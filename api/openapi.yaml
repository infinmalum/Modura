openapi: 3.0.3
info:
  title: Modura HTTP API
  version: 0.1.0
  description: Authoritative HTTP contract for the Modura modular monolith.
servers:
  - url: /api
paths:
  /livez:
    get:
      operationId: getLiveness
      summary: Report whether the process is alive
      tags: [system]
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      operationId: getReadiness
      summary: Report whether the process can serve traffic
      tags: [system]
      responses:
        "200":
          description: Process is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Process is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/login:
    post:
      operationId: login
      summary: Establish a tenant-local session
      tags: [authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session established; the refresh secret is set as an HttpOnly cookie
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
  /platform/auth/login:
    post:
      operationId: platformLogin
      summary: Establish a global platform-administrator session
      tags: [platform-authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformLoginRequest"
      responses:
        "200":
          description: Platform session established with a distinct refresh cookie
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
  /platform/auth/refresh:
    post:
      operationId: platformRefresh
      summary: Rotate a platform-administrator refresh secret
      tags: [platform-authentication]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Platform session rotated
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
        "403":
          $ref: "#/components/responses/CsrfFailed"
  /platform/tenants:
    post:
      operationId: provisionPlatformTenant
      summary: Atomically provision a tenant as a global platform administrator
      tags: [platform-tenants]
      security:
        - platformBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvisionTenantRequest"
      responses:
        "201":
          description: Tenant, first administrator, organization, and role were created atomically
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisionTenantResponse"
        "200":
          description: The same completed provisioning request was returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisionTenantResponse"
        "400":
          description: Invalid provisioning request
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
        "403":
          $ref: "#/components/responses/CsrfFailed"
        "409":
          description: Idempotency key was reused with different input
    get:
      operationId: listPlatformTenants
      summary: List tenants as a global platform administrator
      tags: [platform-tenants]
      security:
        - platformBearerAuth: []
      responses:
        "200":
          description: Tenant summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlatformTenant"
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
  /platform/tenants/{tenantId}/suspend:
    post:
      operationId: suspendPlatformTenant
      summary: Suspend an active tenant with auditable reason
      tags: [platform-tenants]
      security:
        - platformBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantLifecycleRequest"
      responses:
        "204":
          description: Tenant suspended and audit evidence committed
        "400":
          description: Invalid lifecycle transition
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
        "403":
          $ref: "#/components/responses/CsrfFailed"
        "404":
          description: Tenant not found
  /platform/tenants/{tenantId}/reactivate:
    post:
      operationId: reactivatePlatformTenant
      summary: Reactivate a suspended tenant with auditable reason
      tags: [platform-tenants]
      security:
        - platformBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantLifecycleRequest"
      responses:
        "204":
          description: Tenant reactivated and audit evidence committed
        "400":
          description: Invalid lifecycle transition
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
        "403":
          $ref: "#/components/responses/CsrfFailed"
        "404":
          description: Tenant not found
  /auth/refresh:
    post:
      operationId: refresh
      summary: Rotate the refresh secret and issue an access token
      tags: [authentication]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Session rotated
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
        "403":
          $ref: "#/components/responses/CsrfFailed"
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session
      tags: [authentication]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Session revoked and refresh cookie cleared
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
        "403":
          $ref: "#/components/responses/CsrfFailed"
  /auth/logout-all:
    post:
      operationId: logoutAll
      summary: Revoke every session for the authenticated tenant-local user
      tags: [authentication]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: All sessions revoked and refresh cookie cleared
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
        "403":
          $ref: "#/components/responses/CsrfFailed"
  /auth/password:
    put:
      operationId: changePassword
      summary: Change the current user's password and rotate its session
      tags: [authentication]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed, other sessions revoked, and current session rotated
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
        "403":
          $ref: "#/components/responses/CsrfFailed"
  /auth/password-resets:
    post:
      operationId: resetPassword
      summary: Consume a password-reset token
      tags: [authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OneTimeCredentialRequest"
      responses:
        "204":
          description: Password replaced and all sessions revoked
        "400":
          description: Password policy or request validation failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
  /auth/invitations/accept:
    post:
      operationId: acceptInvitation
      summary: Consume an invitation and establish the first password
      tags: [authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OneTimeCredentialRequest"
      responses:
        "204":
          description: Invitation accepted and local account activated
        "400":
          description: Password policy or request validation failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
  /organization/departments:
    get:
      operationId: listDepartments
      summary: List departments in the authenticated tenant
      tags: [organization]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Tenant department list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Department"
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
        "403":
          $ref: "#/components/responses/AuthorizationFailed"
    post:
      operationId: createDepartment
      summary: Create a department in the authenticated tenant
      tags: [organization]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDepartmentRequest"
      responses:
        "201":
          description: Department created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentifierResponse"
        "400":
          description: Invalid department input
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
        "403":
          $ref: "#/components/responses/AuthorizationFailed"
  /organization/departments/{departmentId}:
    parameters:
      - $ref: "#/components/parameters/DepartmentId"
    patch:
      operationId: moveDepartment
      summary: Move a department under another parent
      tags: [organization]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveDepartmentRequest"
      responses:
        "204":
          description: Department moved
        "400":
          description: Move violates a department invariant
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
        "403":
          $ref: "#/components/responses/AuthorizationFailed"
        "404":
          description: Department or parent not found in the tenant
    delete:
      operationId: deleteDepartment
      summary: Delete an unused non-root department
      tags: [organization]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Department deleted
        "400":
          description: Root or referenced department cannot be deleted
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
        "403":
          $ref: "#/components/responses/AuthorizationFailed"
        "404":
          description: Department not found in the tenant
  /organization/positions:
    get:
      operationId: listPositions
      summary: List positions in the authenticated tenant
      tags: [organization]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Tenant position list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Position"
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
        "403":
          $ref: "#/components/responses/AuthorizationFailed"
    post:
      operationId: createPosition
      summary: Create a position in the authenticated tenant
      tags: [organization]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePositionRequest"
      responses:
        "201":
          description: Position created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentifierResponse"
        "400":
          description: Invalid or duplicate position
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
        "403":
          $ref: "#/components/responses/AuthorizationFailed"
  /organization/users/{userId}/assignment:
    put:
      operationId: assignUserOrganization
      summary: Set a user's primary department and optional position
      tags: [organization]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignUserOrganizationRequest"
      responses:
        "204":
          description: User organization assignment replaced
        "400":
          description: Invalid or cross-tenant assignment
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
        "403":
          $ref: "#/components/responses/AuthorizationFailed"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    platformBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 32
        maxLength: 256
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
    DepartmentId:
      name: departmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    AuthenticationFailed:
      description: Tenant or credentials are invalid, or the session is unavailable
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    CsrfFailed:
      description: CSRF validation failed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    AuthorizationFailed:
      description: The authenticated actor lacks the required permission
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [tenant, login, password]
      properties:
        tenant:
          type: string
          minLength: 1
          maxLength: 63
        login:
          type: string
          minLength: 1
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
    PlatformLoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
    PlatformTenant:
      type: object
      additionalProperties: false
      required: [id, slug, displayName, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        displayName:
          type: string
        status:
          type: string
          enum: [provisioning, active, suspended]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProvisionTenantRequest:
      type: object
      additionalProperties: false
      required: [slug, displayName, rootDepartmentName, administratorUsername, reason]
      properties:
        slug:
          type: string
          minLength: 1
          maxLength: 63
          pattern: "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$"
        displayName:
          type: string
          minLength: 1
          maxLength: 128
        rootDepartmentName:
          type: string
          minLength: 1
          maxLength: 128
        administratorUsername:
          type: string
          minLength: 1
          maxLength: 128
        administratorEmail:
          type: string
          format: email
          maxLength: 254
        reason:
          type: string
          minLength: 1
          maxLength: 500
    ProvisionTenantResponse:
      type: object
      additionalProperties: false
      required: [tenantId, created]
      properties:
        tenantId:
          type: string
          format: uuid
        created:
          type: boolean
    TenantLifecycleRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
        newPassword:
          type: string
          minLength: 12
          maxLength: 1024
          writeOnly: true
    OneTimeCredentialRequest:
      type: object
      additionalProperties: false
      required: [token, newPassword]
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 512
          writeOnly: true
        newPassword:
          type: string
          minLength: 12
          maxLength: 1024
          writeOnly: true
    Department:
      type: object
      additionalProperties: false
      required: [id, name, sortOrder]
      properties:
        id:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        sortOrder:
          type: integer
    CreateDepartmentRequest:
      type: object
      additionalProperties: false
      required: [parentId, name, sortOrder]
      properties:
        parentId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 128
        sortOrder:
          type: integer
          minimum: -2147483648
          maximum: 2147483647
    MoveDepartmentRequest:
      type: object
      additionalProperties: false
      required: [parentId]
      properties:
        parentId:
          type: string
          format: uuid
    IdentifierResponse:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id:
          type: string
          format: uuid
    Position:
      type: object
      additionalProperties: false
      required: [id, name, status]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [active, disabled]
    CreatePositionRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
    AssignUserOrganizationRequest:
      type: object
      additionalProperties: false
      required: [departmentId]
      properties:
        departmentId:
          type: string
          format: uuid
        positionId:
          type: string
          format: uuid
          nullable: true
    AccessTokenResponse:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresIn, csrfToken]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          format: int64
          minimum: 1
        csrfToken:
          type: string
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        traceId:
          type: string
